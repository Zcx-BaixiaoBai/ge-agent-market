# 瑞信电表系统 MCP 连接器（开发者：Zcx-BaixiaoBai）
- insert:
    - id: ge-mcp-ruixin-skill
      name: 'ge-mcp-ruixin'
    - id: mcp-ruixin
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ruixin
        transport: stdio
        command: !!js "process.env.GE_MCP_PYTHON || (process.platform === 'win32' ? 'python' : 'python3')"
        args:
          - !!js "`${process.env.GE_MCP_ROOT || ((process.env.HOME || process.env.USERPROFILE || '') + '/GE-MCP')}/ruixin_mcp/server.py`"
        cwd: !!js "`${process.env.GE_MCP_ROOT || ((process.env.HOME || process.env.USERPROFILE || '') + '/GE-MCP')}/ruixin_mcp`"

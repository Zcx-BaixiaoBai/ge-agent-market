# 金鹰物业安全管理系统 MCP 连接器（开发者：张宸熙）
- insert:
    - id: ge-mcp-jinying-skill
      name: 'ge-mcp-jinying'
    - id: mcp-jinying
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: jinying
        transport: stdio
        command: !!js "process.env.GE_MCP_PYTHON || (process.platform === 'win32' ? 'python' : 'python3')"
        args:
          - !!js "`${process.env.GE_MCP_ROOT || ((process.env.HOME || process.env.USERPROFILE || '') + '/GE-MCP')}/jinying_mcp/server.py`"
        cwd: !!js "`${process.env.GE_MCP_ROOT || ((process.env.HOME || process.env.USERPROFILE || '') + '/GE-MCP')}/jinying_mcp`"
